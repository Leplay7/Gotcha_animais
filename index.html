<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gotcha!</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #222;
      color: #fff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    
    /* Canto Superior: Nickname e Estatísticas */
    .top-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #333;
      padding: 10px 15px;
      border-radius: 10px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }

    .nick-container {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nick-input {
      background: #444;
      border: 1px solid #555;
      color: #ffd700;
      padding: 4px 8px;
      border-radius: 5px;
      font-weight: bold;
      width: 100px;
    }

    .stats {
      font-size: 0.9em;
      color: #ddd;
    }

    /* Modal / Chave API */
    #api-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-content {
      background: #fff;
      color: #000;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      max-width: 320px;
    }

    .modal-content input {
      width: 90%;
      padding: 8px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .modal-content button {
      background: #ffd700;
      border: none;
      padding: 10px 15px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Área Principal */
    .camera-area {
      width: 100%;
      max-width: 400px;
      text-align: center;
      background: #333;
      padding: 20px;
      border-radius: 12px;
      box-sizing: border-box;
    }

    input[type="file"] {
      display: none;
    }

    .btn-capture {
      background: #ffd700;
      color: #000;
      padding: 12px 20px;
      font-size: 1em;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: inline-block;
      margin-top: 10px;
    }

    #loading {
      margin-top: 15px;
      color: #ffd700;
      display: none;
    }

    /* Cards da Coleção */
    .collection {
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
    }

    .card {
      background: #444;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .card img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Tela de Inicialização da API Key -->
  <div id="api-modal">
    <div class="modal-content">
      <h3>Bem-vindo ao Gotcha!</h3>
      <p>Cole sua API Key do Google Gemini abaixo para jogar:</p>
      <input type="password" id="api-key-input" placeholder="Cole sua API Key aqui...">
      <button onclick="saveApiKey()">Começar a Jogar</button>
    </div>
  </div>

  <!-- Barra Superior com Nickname e Status -->
  <div class="top-bar">
    <div class="nick-container">
      🎮 <input type="text" id="nickname" class="nick-input" placeholder="Seu Nick" onchange="saveNick(this.value)">
    </div>
    <div class="stats">
      Nível: <span id="level">1</span> | Lvl XP: <span id="xp">0</span>
    </div>
  </div>

  <!-- Área de Captura -->
  <div class="camera-area">
    <h2>Gotcha!</h2>
    <p>Tire uma foto do seu pet ou animal para capturar!</p>
    
    <label for="camera-input" class="btn-capture">📷 Tirar Foto</label>
    <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handleImage(this)">

    <div id="loading">Analisando imagem... aguarde!</div>
  </div>

  <!-- Coleção -->
  <div class="collection">
    <h3>Sua Coleção (<span id="captured-count">0</span>)</h3>
    <div id="cards-list"></div>
  </div>

  <script>
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let playerData = JSON.parse(localStorage.getItem('gotcha_player')) || {
      nick: 'Treinador',
      xp: 0,
      level: 1,
      captured: []
    };

    window.onload = () => {
      if (apiKey) document.getElementById('api-modal').style.display = 'none';
      document.getElementById('nickname').value = playerData.nick;
      updateUI();
    };

    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        apiKey = key;
        document.getElementById('api-modal').style.display = 'none';
      }
    }

    function saveNick(val) {
      playerData.nick = val || 'Treinador';
      saveGame();
    }

    function saveGame() {
      localStorage.setItem('gotcha_player', JSON.stringify(playerData));
      updateUI();
    }

    function updateUI() {
      document.getElementById('level').innerText = playerData.level;
      document.getElementById('xp').innerText = playerData.xp;
      document.getElementById('captured-count').innerText = playerData.captured.length;
      
      const list = document.getElementById('cards-list');
      list.innerHTML = '';
      playerData.captured.forEach(item => {
        list.innerHTML += `
          <div class="card">
            <img src="${item.image}" alt="Pet">
            <div>
              <strong>${item.name}</strong><br>
              <small>${item.desc}</small>
            </div>
          </div>
        `;
      });
    }

    // --- REDIMENSIONAMENTO DE IMAGEM (RESOLVE O PROBLEMA DE MEMÓRIA) ---
    function handleImage(input) {
      if (!input.files || !input.files[0]) return;
      
      document.getElementById('loading').style.display = 'block';
      const file = input.files[0];
      const reader = new FileReader();

      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          // Cria um canvas para reduzir a resolução da foto
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800; // Reduz para no máximo 800px de largura
          const scaleSize = MAX_WIDTH / img.width;
          
          canvas.width = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
          canvas.height = (img.width > MAX_WIDTH) ? (img.height * scaleSize) : img.height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          // Converte para JPEG com 70% de qualidade (extremamente leve)
          const resizedBase64 = canvas.toDataURL('image/jpeg', 0.7);
          
          // Envia para o Gemini
          analyzePet(resizedBase64);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function analyzePet(base64Data) {
      const pureBase64 = base64Data.split(',')[1];

      const prompt = "Identifique o animal desta foto. Responda APENAS em formato JSON válido como este: {\"isAnimal\": true, \"name\": \"Nome do Animal\", \"desc\": \"Uma frase curta sobre ele.\"}. Se não for um animal, retorne {\"isAnimal\": false}.";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: "image/jpeg", data: pureBase64 } }
              ]
            }]
          })
        });

        const data = await response.json();
        const textResponse = data.candidates[0].content.parts[0].text;
        const cleanJson = textResponse.replace(/```json|```/g, '').trim();
        const result = JSON.parse(cleanJson);

        document.getElementById('loading').style.display = 'none';

        if (result.isAnimal) {
          playerData.xp += 50;
          if (playerData.xp >= playerData.level * 100) {
            playerData.level += 1;
            alert(`🎉 Parabéns ${playerData.nick}! Você subiu para o Nível ${playerData.level}!`);
          }
          
          playerData.captured.unshift({
            name: result.name,
            desc: result.desc,
            image: base64Data
          });

          saveGame();
          alert(`✨ Gotcha! Você capturou um ${result.name}!`);
        } else {
          alert("Ops! A IA não identificou um animal nesta foto.");
        }

      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        alert("Erro ao analisar imagem. Verifique sua API Key ou conexão.");
        console.error(err);
      }
    }
  </script>
</body>
</html>
