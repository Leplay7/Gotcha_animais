<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gotcha!</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #222;
      color: #fff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    
    .app-logo {
      background-color: #FACC15;
      width: 75px;
      height: 75px;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .app-logo svg {
      fill: #fff;
      filter: drop-shadow(0px 0px 4px rgba(255, 255, 255, 0.8));
      width: 45px;
      height: 45px;
    }

    .top-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #333;
      padding: 10px 15px;
      border-radius: 10px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }

    .nick-container {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nick-input {
      background: #444;
      border: 1px solid #555;
      color: #ffd700;
      padding: 4px 8px;
      border-radius: 5px;
      font-weight: bold;
      width: 100px;
    }

    .stats {
      font-size: 0.9em;
      color: #ddd;
    }

    #api-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-content {
      background: #fff;
      color: #000;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      max-width: 320px;
    }

    .modal-content input {
      width: 90%;
      padding: 8px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .modal-content button {
      background: #FACC15;
      border: none;
      padding: 10px 15px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }

    .camera-area {
      width: 100%;
      max-width: 400px;
      text-align: center;
      background: #333;
      padding: 20px;
      border-radius: 12px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    input[type="file"] {
      display: none;
    }

    .btn-capture {
      background: #FACC15;
      color: #000;
      padding: 12px 20px;
      font-size: 1em;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: inline-block;
      margin-top: 10px;
    }

    .btn-reset-key {
      background: transparent;
      border: 1px solid #777;
      color: #aaa;
      padding: 5px 10px;
      font-size: 0.8em;
      border-radius: 5px;
      margin-top: 15px;
      cursor: pointer;
    }

    #loading {
      margin-top: 15px;
      color: #FACC15;
      display: none;
    }

    .collection {
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
    }

    .card {
      background: #444;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .card img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div id="api-modal">
    <div class="modal-content">
      <h3>Bem-vindo ao Gotcha!</h3>
      <p>Cole sua API Key do Google AI Studio abaixo:</p>
      <input type="password" id="api-key-input" placeholder="Cole sua API Key aqui...">
      <button onclick="saveApiKey()">Começar a Jogar</button>
    </div>
  </div>

  <div class="top-bar">
    <div class="nick-container">
      🎮 <input type="text" id="nickname" class="nick-input" placeholder="Seu Nick" onchange="saveNick(this.value)">
    </div>
    <div class="stats">
      Nível: <span id="level">1</span> | Lvl XP: <span id="xp">0</span>
    </div>
  </div>

  <div class="camera-area">
    <div class="app-logo">
      <svg viewBox="0 0 24 24">
        <path d="M23.643 4.937c-.835.37-1.732.62-2.675.733.962-.576 1.7-1.49 2.048-2.578-.9.534-1.897.922-2.958 1.13-.85-.904-2.06-1.47-3.4-1.47-2.572 0-4.658 2.086-4.658 4.66 0 .364.042.718.12 1.06-3.873-.195-7.304-2.05-9.602-4.868-.4.69-.63 1.49-.63 2.342 0 1.616.823 3.043 2.072 3.878-.764-.025-1.482-.234-2.11-.583v.06c0 2.257 1.605 4.14 3.737 4.568-.392.106-.803.162-1.227.162-.3 0-.593-.028-.877-.082.593 1.85 2.313 3.198 4.352 3.234-1.595 1.25-3.604 1.995-5.786 1.995-.376 0-.747-.022-1.112-.065 2.062 1.323 4.51 2.093 7.14 2.093 8.57 0 13.255-7.098 13.255-13.254 0-.2-.005-.402-.014-.602.91-.658 1.7-1.477 2.323-2.41z"></path>
      </svg>
    </div>

    <h2>Gotcha!</h2>
    <p>Tire ou escolha uma foto do seu pet para capturar!</p>
    
    <label for="camera-input" class="btn-capture">📸 Enviar ou Tirar Foto</label>
    <input type="file" id="camera-input" accept="image/*" onchange="handleImage(this)">

    <div id="loading">Consultando o Google... aguarde!</div>
    
    <br>
    <button class="btn-reset-key" onclick="resetKey()">🔑 Trocar API Key</button>
  </div>

  <div class="collection">
    <h3>Sua Coleção (<span id="captured-count">0</span>)</h3>
    <div id="cards-list"></div>
  </div>

  <script>
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let playerData = JSON.parse(localStorage.getItem('gotcha_player')) || {
      nick: 'Treinador',
      xp: 0,
      level: 1,
      captured: []
    };

    window.onload = () => {
      if (apiKey) document.getElementById('api-modal').style.display = 'none';
      document.getElementById('nickname').value = playerData.nick;
      updateUI();
    };

    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        apiKey = key;
        document.getElementById('api-modal').style.display = 'none';
      }
    }

    function resetKey() {
      localStorage.removeItem('gemini_api_key');
      apiKey = '';
      document.getElementById('api-key-input').value = '';
      document.getElementById('api-modal').style.display = 'flex';
    }

    function saveNick(val) {
      playerData.nick = val || 'Treinador';
      saveGame();
    }

    function saveGame() {
      localStorage.setItem('gotcha_player', JSON.stringify(playerData));
      updateUI();
    }

    function updateUI() {
      document.getElementById('level').innerText = playerData.level;
      document.getElementById('xp').innerText = playerData.xp;
      document.getElementById('captured-count').innerText = playerData.captured.length;
      
      const list = document.getElementById('cards-list');
      list.innerHTML = '';
      playerData.captured.forEach(item => {
        list.innerHTML += `
          <div class="card">
            <img src="${item.image}" alt="Pet">
            <div>
              <strong>${item.name}</strong><br>
              <small>${item.desc}</small>
            </div>
          </div>
        `;
      });
    }

    function handleImage(input) {
      if (!input.files || !input.files[0]) return;
      
      document.getElementById('loading').style.display = 'block';
      const file = input.files[0];
      const reader = new FileReader();

      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600;
          const scaleSize = MAX_WIDTH / img.width;
          
          canvas.width = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
          canvas.height = (img.width > MAX_WIDTH) ? (img.height * scaleSize) : img.height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          const resizedBase64 = canvas.toDataURL('image/jpeg', 0.6);
          
          analyzePet(resizedBase64);
        };
        img.src = e.result || e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function analyzePet(base64Data) {
      const pureBase64 = base64Data.split(',')[1];
      const prompt = "Identifique o animal desta foto. Responda APENAS em formato JSON valido: {\"isAnimal\": true, \"name\": \"Nome do Animal\", \"desc\": \"Frase curta sobre ele.\"}. Se nao for animal: {\"isAnimal\": false}.";

      try {
        // PASSO 1: Buscar lista de modelos disponíveis na chave
        document.getElementById('loading').innerText = "Analisando chave...";
        const modelsUrl = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
        const modelsRes = await fetch(modelsUrl);
        const modelsData = await modelsRes.json();

        if (modelsData.error) {
          alert("Erro na chave da API: " + modelsData.error.message);
          document.getElementById('loading').style.display = 'none';
          return;
        }

        // PASSO 2: Criar uma lista ordenada priorizando modelos Flash e 2.0 / 1.5
        let candidateModels = [];
        
        for (let m of modelsData.models) {
          if (m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent")) {
            if (m.name.includes("flash")) {
              candidateModels.unshift(m.name); // Joga os flashs para o topo da fila
            } else {
              candidateModels.push(m.name);
            }
          }
        }

        if (candidateModels.length === 0) {
          alert("Erro: O Google não liberou NENHUM modelo compatível para a sua chave.");
          document.getElementById('loading').style.display = 'none';
          return;
        }

        // PASSO 3: Loop de Tentativa (Fallback) - Testa um por um até o Google aceitar
        let success = false;
        let result = null;
        let usedModel = "";

        for (let modelName of candidateModels) {
          try {
            document.getElementById('loading').innerText = `Testando ${modelName.replace('models/', '')}...`;
            const generateUrl = `https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${apiKey}`;

            const response = await fetch(generateUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [
                    { text: prompt },
                    { inline_data: { mime_type: "image/jpeg", data: pureBase64 } }
                  ]
                }]
              })
            });

            const data = await response.json();

            // Se o Google não retornou erro de API, funcionou!
            if (!data.error && data.candidates && data.candidates[0]) {
              const textResponse = data.candidates[0].content.parts[0].text;
              const cleanJson = textResponse.replace(/```json|```/g, '').trim();
              result = JSON.parse(cleanJson);
              usedModel = modelName;
              success = true;
              break; // Para o loop imediatamente pois encontramos um modelo funcional
            }
          } catch (e) {
            // Se falhou, continua silenciosamente para o próximo modelo da lista
          }
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('loading').innerText = "Consultando o Google... aguarde!";

        if (!success || !result) {
          alert("Erro: Nenhum dos modelos testados aceitou a requisição. Sua API Key pode estar restrita ou inativa.");
          return;
        }

        if (result.isAnimal) {
          playerData.xp += 50;
          if (playerData.xp >= playerData.level * 100) {
            playerData.level += 1;
            alert(`🎉 Parabéns ${playerData.nick}! Você subiu para o Nível ${playerData.level}!`);
          }
          
          playerData.captured.unshift({
            name: result.name,
            desc: result.desc,
            image: base64Data
          });

          saveGame();
          alert(`✨ Gotcha! Você capturou um ${result.name}!\n\n(Modelo vencedor: ${usedModel})`);
        } else {
          alert("Ops! A IA não identificou um animal nesta foto.");
        }

      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('loading').innerText = "Consultando o Google... aguarde!";
        alert("Erro de conexão. Tente enviar a foto novamente.");
        console.error(err);
      }
    }
  </script>
</body>
</html>
