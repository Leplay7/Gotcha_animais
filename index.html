<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gotcha!</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #222;
      color: #fff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    
    .app-logo {
      background-color: #FACC15;
      width: 75px;
      height: 75px;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .app-logo svg {
      fill: #fff;
      filter: drop-shadow(0px 0px 4px rgba(255, 255, 255, 0.8));
      width: 45px;
      height: 45px;
    }

    .top-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #333;
      padding: 10px 15px;
      border-radius: 10px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }

    .nick-container {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nick-input {
      background: #444;
      border: 1px solid #555;
      color: #ffd700;
      padding: 4px 8px;
      border-radius: 5px;
      font-weight: bold;
      width: 100px;
    }

    .stats {
      font-size: 0.9em;
      color: #ddd;
    }

    #api-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-content {
      background: #fff;
      color: #000;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      max-width: 320px;
      box-sizing: border-box;
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 0.9em;
    }

    .modal-content button {
      background: #FACC15;
      border: none;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-size: 1em;
    }

    .camera-area {
      width: 100%;
      max-width: 400px;
      text-align: center;
      background: #333;
      padding: 20px;
      border-radius: 12px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    input[type="file"] {
      display: none;
    }

    .btn-capture {
      background: #FACC15;
      color: #000;
      padding: 12px 20px;
      font-size: 1em;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: inline-block;
      margin-top: 10px;
    }

    .btn-reset-key {
      background: transparent;
      border: 1px solid #777;
      color: #aaa;
      padding: 5px 10px;
      font-size: 0.8em;
      border-radius: 5px;
      margin-top: 15px;
      cursor: pointer;
    }

    #loading {
      margin-top: 15px;
      color: #FACC15;
      display: none;
    }

    .section-container {
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
    }

    .card {
      background: #444;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .card img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1.2em;
      cursor: pointer;
      padding: 5px;
    }

    @keyframes rainbow-border {
      0% { border-color: #ef4444; }
      20% { border-color: #f97316; }
      40% { border-color: #eab308; }
      60% { border-color: #22c55e; }
      80% { border-color: #3b82f6; }
      100% { border-color: #a855f7; }
    }

    .rarity-comum { border: 2px solid #aaaaaa !important; }
    .rarity-rara { border: 2px solid #3b82f6 !important; box-shadow: 0 0 8px rgba(59, 130, 246, 0.4); }
    .rarity-epico { border: 2px solid #a855f7 !important; box-shadow: 0 0 8px rgba(168, 85, 247, 0.5); }
    .rarity-mitico { border: 2px solid #ef4444 !important; box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); }
    .rarity-lendario { border: 2px solid #eab308 !important; box-shadow: 0 0 10px rgba(234, 179, 8, 0.7); }
    .rarity-super-lendario { border: 2px solid #ef4444 !important; animation: rainbow-border 2.5s linear infinite; }

    .rarity-tag {
      font-size: 0.7em;
      padding: 2px 6px;
      border-radius: 4px;
      background: #111;
      display: inline-block;
      margin-top: 3px;
      font-weight: bold;
    }

    .category-box {
      background: #2b2b2b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #444;
    }

    .category-title {
      font-size: 1.05em;
      color: #FACC15;
      margin-bottom: 10px;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }

    .species-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .species-item {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      border: 1px dashed #555;
    }

    .species-item.unlocked {
      background: #333;
    }

    .species-silhouette {
      font-size: 2em;
      filter: grayscale(1) brightness(0.3);
